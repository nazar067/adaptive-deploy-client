# Install first without TLS, then use certbot --nginx to add HTTPS + redirect.
server {
    listen 80;
    listen [::]:80;
    server_name adaptive.bandura.monster;
    client_max_body_size 32k;
    location / {
        proxy_pass http://unix:/run/adaptive-web/web.sock:;
        proxy_http_version 1.1;
        proxy_set_header Host adaptive.bandura.monster;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }
}
